                    { id: '3', statement: <span><strong>Consecutivos:</strong> Halla dos números enteros positivos consecutivos tales que la suma de sus cuadrados sea igual a <Latex className="inline" math="145"/>.</span>, eq: 'x^2 + (x+1)^2 = 145', model2: 'x^2 + x - 72 = 0', steps: ['2x^2 + 2x + 1 = 145', 'x^2 + x - 72 = 0', '(x + 9)(x - 8) = 0', 'x = 8 \\text{ (debe ser positivo)}'], rootStr: '\\text{Los números son 8 y 9}' },
                    { id: '4', statement: <span><strong>Física:</strong> La altura <Latex className="inline" math="h"/> de un objeto lanzado hacia arriba en función del tiempo <Latex className="inline" math="t"/> es <Latex className="inline" math="h(t)=40t-5t^2"/>. ¿En qué segundo(s) alcanzará <Latex className="inline" math="75\text{m}"/>?</span>, eq: 'h(t) = 75', model2: 't^2 - 8t + 15 = 0', steps: ['40t - 5t^2 = 75', 't^2 - 8t + 15 = 0', '(t - 3)(t - 5) = 0', 't_1 = 3, \\; t_2 = 5'], rootStr: '\\text{A los } 3\\text{s y } 5\\text{s}' },
                    { id: '5', statement: <span><strong>Biohuerto:</strong> Un terreno tiene un área <Latex className="inline" math="A(x)=2x^2+9x+10"/>. Sus lados son los factores primos. Si <Latex className="inline" math="x=4\text{m}"/>, halla las dimensiones reales.</span>, eq: 'A(x) = (2x+5)(x+2)', model2: '13\\text{m } \\times 6\\text{m}', steps: ['\\text{Base: } 2(4) + 5 = 13', '\\text{Altura: } 4 + 2 = 6', '\\text{Área final: } 13 \\times 6 = 78', '\\text{Dimensiones calculadas: } 13\\text{m } \\times 6\\text{m}'], rootStr: '\\text{Dimensiones: } 13\\text{m y } 6\\text{m}' }
                ],
                expl: [
                    "Identificamos el modelo general del problema.",
                    "Planteamos y expandimos la ecuación.",
                    "Reducimos a la forma cuadrática estándar.",
                    "Factorizamos rápidamente para resolver.",
                    "Interpretamos el resultado descartando valores imposibles."
                ]
            }
        ];

        /* Fondo Animado Gamer Cuadrático */
        const FloatingBg = React.memo(() => {
            const items = useMemo(() => {
                const symbols = [
                    'x^2', 'ax^2+bx+c=0', '\\Delta=b^2-4ac', 
                    'x_1, x_2', '\\pm\\sqrt{\\Delta}', '\\frac{-b\\pm\\sqrt{\\Delta}}{2a}', 
                    '✨', '🔥', '🎮', 'x^2-9x+20'
                ];
                return Array.from({ length: 25 }).map((_, i) => {
                    const sym = symbols[i % symbols.length];
                    return {
                        id: i,
                        sym,
                        isTex: sym.includes('\\') || sym.includes('^') || sym.includes('_'),
                        left: `${(i * 17) % 96}%`,
                        duration: `${10 + (i % 10) * 1.5}s`,
                        delay: `-${(i * 2) % 20}s`,
                        size: `${1.1 + (i % 4) * 0.5}rem`,
                        opacity: 0.15 + (i % 3) * 0.1
                    };
                });
            }, []);

            return (
                <div className="absolute inset-0 overflow-hidden pointer-events-none z-0">
                    {items.map((it) => (
                        <div key={it.id} className="absolute text-white/50 font-black animate-floatUp select-none drop-shadow-[0_0_8px_rgba(255,255,255,0.4)]"
                            style={{
                                left: it.left,
                                bottom: '-15%',
                                fontSize: it.size,
                                opacity: it.opacity,
                                animationDuration: it.duration,
                                animationDelay: it.delay
                            }}>
                            {it.isTex ? <Latex math={it.sym} /> : it.sym}
                        </div>
                    ))}
                </div>
            );
        });

        /* Robot Asistente Animado */
        const RobotAssistant = ({ isHappy }) => {
            const containerAnim = isHappy ? 'animate-robotJump' : 'animate-robotFloat';
            const armLAnim = isHappy ? 'rotate-[145deg] animate-pulse' : 'animate-robotTalkArmL';
            const armRAnim = isHappy ? '-rotate-[145deg] animate-pulse' : 'animate-robotTalkArmR';

            return (
                <div className={`relative flex flex-col items-center drop-shadow-lg select-none ${containerAnim}`}>
                    <div className="relative z-0 flex flex-col items-center translate-y-1">
                        <div className={`w-4 h-4 rounded-full shadow-[0_0_12px_currentColor] z-10 transition-colors duration-300 ${isHappy ? 'text-emerald-400 bg-emerald-400 animate-pulse' : 'text-cyan-400 bg-cyan-400'}`}></div>
                        <div className="w-1.5 h-4 bg-slate-400"></div>
                    </div>
                    <div className="relative z-10 w-16 h-16 sm:w-20 sm:h-20 bg-gradient-to-br from-slate-100 to-slate-300 rounded-[1.5rem] border-[4px] border-slate-400 shadow-xl flex flex-col items-center justify-center p-2">
                        <div className="w-full h-full bg-slate-800 rounded-xl flex flex-col items-center justify-center p-1.5 shadow-inner border-2 border-slate-600">
                            {isHappy ? (
                                <div className="w-full flex justify-between px-1.5">
                                    <div className="w-3.5 h-2 bg-emerald-400 rounded-t-full mt-1"></div>
                                    <div className="w-3.5 h-2 bg-emerald-400 rounded-t-full mt-1"></div>
                                </div>
                            ) : (
                                <div className="w-full flex justify-between px-1.5">
                                    <div className="w-3 h-3 bg-cyan-400 rounded-full animate-pulse shadow-[0_0_5px_#00f0ff]"></div>
                                    <div className="w-3 h-3 bg-cyan-400 rounded-full animate-pulse shadow-[0_0_5px_#00f0ff]"></div>
                                </div>
                            )}
                            {isHappy ? (
                                <div className="w-6 h-3.5 bg-white rounded-b-full mt-1.5 shadow-[0_0_8px_white]"></div>
                            ) : (
                                <div className="w-5 h-1.5 bg-amber-400 rounded-full mt-2 shadow-[0_0_5px_#fbbf24]"></div>
                            )}
                        </div>
                    </div>
                    <div className={`absolute top-1/2 -left-2.5 w-3.5 h-5 bg-slate-300 border-[3px] border-slate-400 rounded-full z-0 origin-top ${armLAnim}`}></div>
                    <div className={`absolute top-1/2 -right-2.5 w-3.5 h-5 bg-slate-300 border-[3px] border-slate-400 rounded-full z-0 origin-top ${armRAnim}`}></div>
                </div>
            );
        };

        function App() {
            const [showCover, setShowCover] = useState(true);
            const [modIdx, setModIdx] = useState(0);
            const [exIdx, setExIdx] = useState(0);
            const [stepIdx, setStepIdx] = useState(0);
            const [muted, setMuted] = useState(false);

            const handleToggleMute = () => {
                AudioController.init();
                setMuted(AudioController.toggleMute());
            };

            const enterModule = (idx) => {
                AudioController.init();
                AudioController.play('swoosh');
                setModIdx(idx);
                setExIdx(0);
                setStepIdx(0);
                setShowCover(false);
            };

            const selectExercise = (idx) => {
                AudioController.init();
                AudioController.play('pop');
                setExIdx(idx);
                setStepIdx(0);
            };

            const moduleData = MODULES[modIdx];
            const exercise = moduleData.exercises[exIdx];
            const maxSteps = moduleData.expl.length - 1;
            const isHappy = stepIdx === maxSteps;

            const nextStep = () => {
                if (stepIdx < maxSteps) {
                    AudioController.init();
                    setStepIdx(prev => prev + 1);
                    if (stepIdx + 1 === maxSteps) {
                        AudioController.play('success');
                    } else {
                        AudioController.play('pop');
                    }
                }
            };

            const prevStep = () => {
                if (stepIdx > 0) {
                    AudioController.init();
                    AudioController.play('pop-reverse');
                    setStepIdx(prev => prev - 1);
                }
            };

            /* ==============================
               RENDERIZADOR CONTINUO - PIZARRA CENTRAL
               ============================== */
            const renderContinuousBoard = () => {
                
                // MÓDULO 1: ASPA SIMPLE (Animación con impacto y filas completas)
                if (moduleData.id === 'aspa') {
                    const eqRender = () => {
                        if (stepIdx === 1) return `\\color{#10b981}${exercise.t1}\\color{black} ${exercise.t2} \\color{#f97316}${exercise.t3}\\color{black} = 0`;
                        if (stepIdx === 3) return `${exercise.t1} \\color{#6366f1}${exercise.t2}\\color{black} ${exercise.t3} = 0`;
                        return exercise.eq;
                    };

                    return (
                        <div className="w-full flex flex-col items-center text-xl sm:text-2xl font-bold text-slate-800 leading-tight">
                            <div className="bg-white/80 px-4 py-2 rounded-xl shadow-sm border border-slate-200">
                                <Latex math={eqRender()} />
                            </div>
                            
                            {stepIdx >= 1 && (
                                <div className="mt-2 relative w-[280px] h-[130px] mx-auto animate-fadeIn">
                                    <svg className="absolute inset-0 w-full h-full pointer-events-none z-0">
                                        {stepIdx >= 2 && (
                                            <>
                                                {/* x to -5 (de la fila superior izq a inferior der) */}
                                                <line x1="20%" y1="20%" x2="60%" y2="80%" stroke="#10b981" strokeWidth="4" strokeLinecap="round" className="cross-line"/>
                                                {/* -4 to x (de la fila inferior izq a superior der) */}
                                                <line x1="20%" y1="80%" x2="60%" y2="20%" stroke="#f97316" strokeWidth="4" strokeLinecap="round" className="cross-line"/>
                                            </>
                                        )}
                                        {stepIdx >= 3 && (
                                            /* Vertical cruzando ambas aspas marcando suma central */
                                            <line x1="40%" y1="5%" x2="40%" y2="95%" stroke="#6366f1" strokeWidth="5" strokeLinecap="round" className="vertical-check"/>
                                        )}
                                    </svg>
                                    
                                    {/* Fila 1 */}
                                    <div className="absolute top-[10%] left-[10%] z-10 text-emerald-800"><Latex math={exercise.f1}/></div>
                                    <div className="absolute top-[10%] left-[55%] z-10 text-orange-800"><Latex math={exercise.f2}/></div>
                                    
                                    {/* Fila 2 */}
                                    <div className="absolute top-[70%] left-[10%] z-10 text-orange-800"><Latex math={exercise.f3}/></div>
                                    <div className="absolute top-[70%] left-[55%] z-10 text-emerald-800"><Latex math={exercise.f4}/></div>

                                    {/* Resultados Parciales */}
                                    {stepIdx >= 2 && (
                                        <>
                                            <div className="absolute top-[10%] right-[0%] z-10 text-emerald-600 animate-fadeIn"><Latex math={exercise.m2}/></div>
                                            <div className="absolute top-[70%] right-[0%] z-10 text-orange-600 animate-fadeIn"><Latex math={exercise.m1}/></div>
                                        </>
                                    )}
                                </div>
                            )}
                            
                            {stepIdx >= 3 && (
                                <div className="text-xl font-black text-indigo-700 animate-fadeIn flex justify-center items-center mt-1">
                                    <Latex math={`\\text{Suma: } ${exercise.check}`} /> ✅
                                </div>
                            )}
                            
                            {stepIdx >= 4 && (
                                <div className="animate-fadeIn mt-3 bg-emerald-100 px-4 py-2 rounded-xl border border-emerald-300 w-full max-w-sm text-center shadow-sm">
                                    <Latex math={exercise.fact} className="text-emerald-900 text-[1.1rem] sm:text-[1.3rem]" />
                                </div>
                            )}
                        </div>
                    );
                }

                // MÓDULO 2, 3, 4: RENDERIZADO ESTÁNDAR CONTINUO (Sin salto, menos espacio)
                return (
                    <div className="w-full flex flex-col items-center text-[1.1rem] sm:text-[1.4rem] font-bold text-slate-800 leading-[1.6]">
                        <div className="bg-white/80 px-4 py-2 rounded-xl shadow-sm border border-slate-200 mb-2">
                            <Latex math={exercise.eq} />
                        </div>
                        
                        {exercise.steps.map((st, i) => (
                            stepIdx > i && (
                                <div key={i} className={`animate-fadeIn w-full text-center ${i === exercise.steps.length - 1 ? 'bg-emerald-50 px-4 py-2 rounded-xl border border-emerald-300 text-emerald-800 mt-2 font-black' : ''}`}>
                                    <Latex math={st} />
                                </div>
                            )
                        ))}
                    </div>
                );
            };

            /* ==============================
               MÓDULO DE FÓRMULA DERECHA
               ============================== */
            const getRightPanelLaTeX = () => {
                if (moduleData.id === 'aspa') {
                    if (stepIdx < 4) return `ax^2 + bx + c = 0`;
                    return `(x ${exercise.f2})(x ${exercise.f4}) = 0`;
                }
                if (moduleData.id === 'completar') {
                    if (stepIdx < 3) return `x^2 + bx + (\\frac{b}{2})^2`;
                    return `(x ${exercise.halfB})^2 = ${exercise.right2}`;
                }
                if (moduleData.id === 'formula') {
                    if (stepIdx < 3) return `\\Delta = ${exercise.delta}`;
                    return `x = \\frac{${-(parseInt(exercise.b))} \\pm ${Math.sqrt(exercise.delta) || '\\sqrt{'+exercise.delta+'}'}}{${2*exercise.a}}`;
                }
                if (moduleData.id === 'aplicaciones') {
                    if (stepIdx < 2) return `ax^2 + bx + c = 0`;
                    return exercise.model2;
                }
            };

            const getCalculatedValue = () => {
                if (stepIdx < maxSteps) return `\\text{Calculando...}`;
                if (moduleData.id === 'aplicaciones') return `\\text{Resuelto}`;
                if (moduleData.id === 'formula') return exercise.rootStr;
                return `x_1 = ${exercise.rootStr.split(', ')[0].split('=')[1]}, \\; x_2 = ${exercise.rootStr.split(', ')[1]?.split('=')[1] || exercise.rootStr.split(',')[1]}`;
            };


            /* ==========================================
               VISTA 1: PORTADA ESTILO GAMER NEÓN
               ========================================== */
            if (showCover) {
                return (
                    <div className="min-h-[100dvh] bg-[#0a0f1d] flex flex-col items-center justify-center p-4 sm:p-8 relative overflow-x-hidden select-none">
                        {/* Luces Ambientales Difuminadas (Neón) */}
                        <div className="absolute top-[10%] left-1/4 -translate-x-1/2 w-[380px] h-[380px] sm:w-[600px] sm:h-[600px] bg-indigo-600/30 blur-[100px] rounded-full pointer-events-none z-0 mix-blend-screen animate-pulse" style={{ animationDuration: '4s' }}></div>
                        <div className="absolute bottom-[5%] right-[10%] w-[300px] h-[300px] sm:w-[500px] sm:h-[500px] bg-fuchsia-600/20 blur-[80px] rounded-full pointer-events-none z-0 mix-blend-screen animate-pulse" style={{ animationDuration: '6s', animationDelay: '1s' }}></div>
                        <div className="absolute top-[40%] right-1/4 w-[250px] h-[250px] bg-cyan-400/20 blur-[90px] rounded-full pointer-events-none z-0 mix-blend-screen animate-pulse" style={{ animationDuration: '5s', animationDelay: '2s' }}></div>

                        <FloatingBg />

                        {/* Botón de Sonido Superior Derecho */}
                        <div className="absolute top-4 right-4 z-20">
                            <button onClick={handleToggleMute} className="p-3 rounded-2xl bg-white/10 backdrop-blur-md shadow-lg text-white hover:bg-white/20 transition-all hover:scale-110 active:scale-95 border border-white/10">
                                {muted ? <Icons.VolumeX size={24} className="text-rose-400 drop-shadow-[0_0_8px_#fb7185]" /> : <Icons.Volume2 size={24} className="text-cyan-400 drop-shadow-[0_0_8px_#22d3ee]" />}
                            </button>
                        </div>

                        {/* Contenido Principal de Portada */}
                        <div className="relative z-10 text-center w-full max-w-7xl mt-4 sm:mt-0 flex flex-col items-center">
                            <div className="inline-flex items-center gap-2 px-6 py-2 rounded-full border-2 border-cyan-400/50 bg-slate-900/60 backdrop-blur-xl text-cyan-300 font-black tracking-widest uppercase mb-5 shadow-[0_0_15px_rgba(34,211,238,0.4)] animate-slideInUp" style={{ animationDelay: '0.1s' }}>
                                <Icons.Gamepad size={20} /> TuProfe20 Lab
                            </div>

                            <h1 className="text-4xl sm:text-6xl md:text-[5rem] leading-[1.08] font-black text-transparent bg-clip-text bg-gradient-to-br from-white via-cyan-200 to-blue-500 mb-5 drop-shadow-[0_4px_12px_rgba(0,0,0,0.5)] animate-slideInUp" style={{ animationDelay: '0.2s' }}>
                                Ecuaciones <br className="hidden sm:block" />Cuadráticas
                            </h1>

                            <p className="text-base sm:text-xl md:text-2xl text-blue-200/90 mb-10 font-bold max-w-3xl mx-auto px-4 animate-slideInUp" style={{ animationDelay: '0.3s' }}>
                                Selecciona un módulo interactivo para explorar la factorización, fórmula general y aplicaciones en problemas reales, todo renderizado con LaTeX. 🚀✨
                            </p>

                            {/* Grid de Tarjetas de los 4 Módulos */}
                            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5 w-full max-w-6xl px-2 pb-8">
                                {MODULES.map((mod, idx) => {
                                    const CardIcon = Icons[mod.icon] || Icons.Shapes;
                                    return (
                                        <button key={mod.id} onClick={() => enterModule(idx)}
                                            className={`group text-left p-6 rounded-[2rem] bg-gradient-to-br ${mod.color} border-[2px] border-white/15 backdrop-blur-xl hover:-translate-y-3 hover:scale-[1.02] hover:shadow-[0_20px_40px_rgba(0,0,0,0.45)] hover:border-white/45 transition-all duration-300 flex flex-col h-full relative overflow-hidden animate-slideInUp`}
                                            style={{ animationDelay: `${0.35 + idx * 0.08}s`, animationFillMode: 'both' }}>
                                            <div className="absolute -bottom-4 -right-4 p-4 opacity-10 group-hover:opacity-25 group-hover:scale-125 transition-all duration-500 text-white">
                                                <CardIcon size={92} />
                                            </div>
                                            <div className="bg-white/15 text-white text-xs font-bold px-4 py-1.5 rounded-full inline-block mb-3 shadow-sm backdrop-blur-md self-start border border-white/25">
                                                {mod.badge}
                                            </div>
                                            <h3 className="text-xl font-black text-white mb-2 drop-shadow-md leading-tight">
                                                {mod.shortTitle}
                                            </h3>
                                            <p className="text-white/80 text-xs sm:text-sm font-medium line-clamp-3 mb-4 leading-relaxed">
                                                {mod.title}
                                            </p>
                                            <div className="mt-auto bg-slate-950/45 border border-white/20 rounded-2xl px-3 py-2 text-cyan-200 text-center text-xs overflow-x-auto shadow-inner">
                                                <Latex math={mod.latexFormula} />
                                            </div>
                                        </button>
                                    );
                                })}
                            </div>
                        </div>
                    </div>
                );
            }

            /* ==========================================
               VISTA 2: LABORATORIO INTERACTIVO (DISEÑO GAMER/DUAL)
               ========================================== */
            return (
                <div className="min-h-[100dvh] w-full bg-gradient-to-br from-indigo-900 via-[#0f172a] to-fuchsia-900 text-slate-800 flex flex-col p-2 sm:p-4 relative overflow-hidden select-none">
                    <FloatingBg />

                    {/* HEADER SUPERIOR */}
                    <div className="shrink-0 relative z-10 w-full max-w-7xl mx-auto flex justify-between items-center mb-3 px-1 sm:px-2">
                        <button onClick={() => { AudioController.init(); AudioController.play('swoosh'); setShowCover(true); }}
                            className="flex items-center justify-center w-11 h-11 sm:w-auto sm:px-5 sm:py-2.5 rounded-[1.2rem] bg-white/10 border-2 border-white/20 backdrop-blur-md text-white font-black hover:bg-white/20 transition-all shadow-md active:scale-95 hover:scale-105">
                            <Icons.Home size={22} className="sm:mr-2" />
                            <span className="hidden sm:inline text-base sm:text-lg">Menú</span>
                        </button>

                        <h2 className="text-sm sm:text-xl md:text-2xl font-black text-cyan-300 drop-shadow-[0_0_10px_rgba(34,211,238,0.5)] tracking-wide bg-slate-900/60 px-4 sm:px-8 py-2.5 rounded-full border border-cyan-500/30 text-center truncate mx-2">
                            {moduleData.badge}: {moduleData.shortTitle}
                        </h2>

                        <button onClick={handleToggleMute} className="flex p-2.5 sm:p-3 rounded-[1.2rem] bg-white/10 border-2 border-white/20 backdrop-blur-md text-white hover:bg-white/20 transition-all shadow-md active:scale-95 hover:scale-105">
                            {muted ? <Icons.VolumeX size={22} className="text-rose-400" /> : <Icons.Volume2 size={22} className="text-cyan-400" />}
                        </button>
                    </div>

                    {/* SELECTOR DE NIVELES (EJERCICIOS) */}
                    <div className="relative z-10 w-full max-w-7xl mx-auto flex justify-center gap-2 mb-4 overflow-x-auto px-2 pb-2">
                        {moduleData.exercises.map((ex, idx) => (
                            <button key={ex.id} onClick={() => selectExercise(idx)}
                                className={`px-5 py-2 rounded-xl font-black text-sm uppercase transition-all whitespace-nowrap border-2 shadow-lg ${
                                    exIdx === idx ? `bg-gradient-to-r ${moduleData.color} border-white text-white scale-105` : 'bg-slate-800/60 border-slate-700 text-slate-400 hover:text-white'
                                }`}>
                                Nivel {idx + 1}
                            </button>
                        ))}
                    </div>

                    {/* TARJETA UNIFICADA CON BORDE AZUL Y FONDO BLANCO CUADRICULADO */}
                    <div className="flex-1 min-h-[65vh] relative z-10 w-full max-w-7xl mx-auto bg-[#fdfdfd] rounded-[1.5rem] sm:rounded-[2.5rem] border-[5px] sm:border-[8px] border-blue-600 shadow-[0_20px_50px_rgba(0,0,0,0.4)] flex flex-col overflow-hidden">
                        
                        {/* CUADRÍCULA MATEMÁTICA DE FONDO GLOBAL OPACIDAD 0.20 */}
                        <div className="absolute inset-0 opacity-[0.20] bg-[linear-gradient(#475569_1px,transparent_1px),linear-gradient(90deg,#475569_1px,transparent_1px)] [background-size:24px_24px] pointer-events-none z-0"></div>

                        {/* PIZARRA CENTRAL */}
                        <div className="flex-1 flex flex-col items-center justify-start pt-3 pb-4 sm:pt-5 sm:pb-6 px-3 sm:px-6 relative overflow-y-auto w-full z-10">
                            
                            {/* CAJA DE ENUNCIADO ÁMBAR/NEÓN */}
                            <div className="w-full max-w-6xl bg-amber-50 rounded-2xl border-l-[8px] border-amber-500 p-3.5 sm:p-5 mb-4 shadow-sm relative">
                                <div className="text-slate-800 text-sm sm:text-lg md:text-xl font-bold mb-2 leading-relaxed">
                                    {exercise.statement}
                                </div>
                                <div className="flex flex-col sm:flex-row gap-2 sm:gap-6 text-xs sm:text-base font-black text-amber-800">
                                    <span className="bg-amber-200/60 px-3 py-1 rounded-lg">{moduleData.qa}</span>
                                    <span className="bg-amber-200/60 px-3 py-1 rounded-lg">{moduleData.qb}</span>
                                </div>
                            </div>

                            {/* BANNER DUAL: IZQUIERDA (PIZARRA GEOMÉTRICA/RESOLUCIÓN) | DERECHA (DEMOSTRACIÓN LATEX EN VIVO) */}
                            <div className="w-full max-w-6xl bg-white/95 rounded-3xl shadow-lg border-[4px] border-indigo-400 flex flex-col lg:flex-row overflow-hidden relative z-10">
                                
                                {/* LADO IZQUIERDO: RESOLUCIÓN AMPLIADA (65%) */}
                                <div className="lg:w-[65%] p-3 sm:p-6 flex flex-col items-center justify-center relative bg-slate-50/50">
                                    <div className="w-full flex items-center justify-start mb-4 px-1">
                                        <span className="px-3 py-1 bg-indigo-100 text-indigo-700 font-black rounded-full text-xs sm:text-sm uppercase tracking-wider shadow-sm border border-indigo-200">
                                            a) Resolución Paso a Paso
                                        </span>
                                    </div>
                                    <div className="w-full flex-1 flex flex-col justify-center min-h-[220px]">
                                        {renderVisualLeft()}
                                    </div>
                                </div>

                                {/* DIVISOR CENTRAL */}
                                <div className="w-full h-[4px] lg:w-[4px] lg:h-auto bg-indigo-400"></div>

                                {/* LADO DERECHO: FÓRMULA LATEX Y RESULTADO DORADO (35%) */}
                                <div className="lg:w-[35%] p-4 sm:p-6 flex flex-col items-center justify-center bg-indigo-50/50 relative gap-4">
                                    <div className="w-full flex items-center justify-start mb-2">
                                        <span className="px-3 py-1 bg-fuchsia-100 text-fuchsia-700 font-black rounded-full text-xs sm:text-sm uppercase tracking-wider shadow-sm border border-fuchsia-200">
                                            b) Desarrollo LaTeX
                                        </span>
                                    </div>

                                    {/* Sustitución en Tiempo Real */}
                                    <div className="w-full bg-white px-4 py-4 rounded-2xl border-2 border-indigo-200 shadow-sm text-center">
                                        <span className="text-[11px] font-black uppercase tracking-wider text-indigo-600 block mb-2">
                                            EXPRESIÓN ACTUAL
                                        </span>
                                        <div className="text-xl sm:text-2xl text-slate-800 overflow-x-auto py-1">
                                            <Latex math={getRightPanelLaTeX()} block />
                                        </div>
                                    </div>

                                    {/* Resultado Destacado Estilo Dorado */}
                                    <div className={`w-full transition-all duration-500 ${isHappy ? 'bg-gradient-to-br from-[#fde047] to-[#eab308] border-[5px] border-[#ca8a04] shadow-[0_10px_25px_rgba(234,179,8,0.35)]' : 'bg-slate-100 border-[3px] border-slate-300 opacity-60'} px-6 py-5 rounded-3xl text-center mt-auto`}>
                                        <span className={`text-[11px] font-black uppercase tracking-widest block mb-1 ${isHappy ? 'text-amber-950/80' : 'text-slate-500'}`}>
                                            RAÍCES OBTENIDAS
                                        </span>
                                        <div className={`text-2xl sm:text-3xl font-black ${isHappy ? 'text-black' : 'text-slate-400'}`}>
                                            <Latex math={getCalculatedValue()} block />
                                        </div>
                                    </div>
                                </div>

                            </div>
                        </div>

                        {/* SECCIÓN DE EXPLICACIÓN DEL ROBOT */}
                        <div className="shrink-0 bg-white/85 backdrop-blur-md w-full px-4 py-3 sm:px-8 sm:py-4 flex items-center gap-4 sm:gap-6 border-t-[5px] border-indigo-200 z-10 relative">
                            <div className="shrink-0">
                                <RobotAssistant isHappy={isHappy} />
                            </div>
                            <div className="flex-1 text-sm sm:text-lg md:text-xl font-bold text-slate-800 leading-snug sm:leading-relaxed bg-slate-50/90 sm:bg-transparent p-3 sm:p-0 rounded-2xl border border-slate-200 sm:border-none">
                                {isHappy ? "¡NIVEL COMPLETADO! Has resuelto la ecuación magistralmente. Pasa al siguiente nivel." : moduleData.expl[stepIdx]}
                            </div>
                        </div>

                        {/* CONTROLES INFERIORES */}
                        <div className="shrink-0 bg-white/95 backdrop-blur-md p-3 sm:p-5 w-full flex flex-col items-center gap-3 border-t-[5px] border-indigo-200 z-10 relative">
                            <div className="flex justify-center items-stretch w-full max-w-4xl gap-3 sm:gap-4 h-14 sm:h-16">
                                <button onClick={prevStep} disabled={stepIdx === 0}
                                    className={`flex-[0.6] sm:flex-[0.8] rounded-l-[1.4rem] rounded-r-2xl font-black text-base sm:text-xl flex items-center justify-center gap-1 sm:gap-2 active:translate-y-[6px] transition-all border-b-[6px] active:border-b-0 ${
                                        stepIdx === 0 ? 'bg-slate-200 text-slate-400 border-slate-300 cursor-not-allowed' : 'bg-indigo-200 text-indigo-900 border-indigo-400 hover:bg-indigo-300'
                                    }`}>
                                    <Icons.ChevronLeft size={28} />
                                    <span className="hidden sm:inline">Paso Ant.</span>
                                </button>

                                <div className="bg-indigo-600 text-white font-black px-4 sm:px-8 text-base sm:text-xl flex items-center justify-center rounded-2xl border-b-[6px] border-indigo-800 shadow-inner whitespace-nowrap">
                                    Paso {stepIdx + 1} / {maxSteps + 1}
                                </div>

                                {!isHappy ? (
                                    <button onClick={nextStep}
                                        className="flex-[1.4] sm:flex-[1.8] bg-gradient-to-r from-blue-500 to-indigo-500 border-b-[6px] border-indigo-700 text-white rounded-r-[1.4rem] rounded-l-2xl font-black text-base sm:text-2xl flex items-center justify-center gap-2 active:border-b-0 active:translate-y-[6px] transition-all hover:brightness-110 shadow-md">
                                        <span>Siguiente Paso</span>
                                        <Icons.Play size={24} fill="currentColor" />
                                    </button>
                                ) : (
                                    <button onClick={() => selectExercise((exIdx + 1) % 5)}
                                        className="flex-[1.4] sm:flex-[1.8] bg-gradient-to-r from-emerald-500 to-green-500 border-b-[6px] border-green-700 text-white rounded-r-[1.4rem] rounded-l-2xl font-black text-base sm:text-2xl flex items-center justify-center gap-2 active:border-b-0 active:translate-y-[6px] transition-all hover:brightness-110 shadow-[0_0_15px_rgba(16,185,129,0.5)] animate-pulse">
                                        <span>Siguiente Nivel</span>
                                        <Icons.ChevronRight size={28} />
                                    </button>
                                )}
                            </div>
                        </div>

                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
